name: Auto-merge post-deployment cleanup PR

on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review, closed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'github-actions[bot]'
      && github.event.action != 'closed'
    steps:
      - name: Check PR meets merge criteria
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Checking PR #$PR_NUMBER"

          # 1. Check PR title
          TITLE="${{ github.event.pull_request.title }}"
          if [ "$TITLE" != "chore: Post-deployment cleanup" ]; then
            echo "Title mismatch: expected 'chore: Post-deployment cleanup', got '$TITLE'"
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Title: ✅ matches"

          # 2. Check changed files (only CHANGELOG.md, build.gradle.kts, versions.json allowed)
          FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          echo "Changed files:"
          echo "$FILES"

          DISALLOWED=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              CHANGELOG.md|build.gradle.kts|versions.json) ;;
              *)
                DISALLOWED="$DISALLOWED $file"
                ;;
            esac
          done <<< "$FILES"

          if [ -n "$DISALLOWED" ]; then
            echo "Disallowed files changed:$DISALLOWED"
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files: ✅ only allowed files changed"

          echo "should_merge=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.check.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
          echo "Auto-merge enabled for PR #${{ github.event.pull_request.number }}"

  cleanup:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'github-actions[bot]'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
    steps:
      - name: Delete source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Cleaning up branch: $BRANCH"
          until gh api "repos/${{ github.repository }}/git/refs/heads/$BRANCH" -X DELETE 2>/dev/null; do
            sleep 2
          done
          echo "Deleted branch $BRANCH"
