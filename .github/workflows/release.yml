name: Release to CurseForge & Modrinth

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        type: choice
        options: [alpha, beta, release]
        default: alpha
      bump-type:
        description: Version bump type
        type: choice
        options: [major, minor, patch, skip]
        default: minor
      deploy-to-curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true
      deploy-to-modrinth:
        description: Upload to Modrinth
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Read CHANGELOG.md from main
      id: changelog
      run: |
        if [ -f CHANGELOG.md ] && [ -s CHANGELOG.md ]; then
          echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          cat CHANGELOG.md >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "Read changelog ($(wc -c < CHANGELOG.md) bytes)"
        else
          echo "changelog=" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG.md is empty or missing — no changelog will be sent"
        fi

    - name: Bump version
      id: version
      run: |
        BUMP_TYPE="${{ inputs.bump-type }}"

        CURRENT_VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
        echo "Current version: $CURRENT_VERSION"

        if [ "$BUMP_TYPE" = "skip" ]; then
          echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Skipping version bump (stays $CURRENT_VERSION)"
          exit 0
        fi

        IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

        case "$BUMP_TYPE" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac

        NEW_VERSION="${major}.${minor}.${patch}"

        # Update root build.gradle.kts
        sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" build.gradle.kts

        # Update ALL modVersion entries in versions.json (regardless of current value)
        sed -i 's/"modVersion"[[:space:]]*:[[:space:]]*"[^"]*"/"modVersion": "'"$NEW_VERSION"'"/g' versions.json

        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "Version bumped to $NEW_VERSION"

    - name: Build all modules
      run: ./gradlew buildAll

    - name: Collect distribution JARs
      run: ./gradlew collectArtifacts

    - name: Publish to CurseForge & Modrinth
      uses: Kira-NT/mc-publish@v3
      with:
        files: build/distributions/GlobalControls-*.jar
        modrinth-id: ZHOPaj3I
        modrinth-token: ${{ inputs.deploy-to-modrinth && secrets.MODRINTH_API_TOKEN || '' }}
        curseforge-id: 1591751
        curseforge-token: ${{ inputs.deploy-to-curseforge && secrets.CURSEFORGE_API_TOKEN || '' }}
        version-type: ${{ inputs.release-type }}
        changelog: ${{ steps.changelog.outputs.changelog }}
        game-version-filter: releases

    - name: Create CHANGELOG.md, commit, push branch, and create PR
      if: ${{ inputs.bump-type != 'skip' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"

        # Create/empty CHANGELOG.md
        > CHANGELOG.md

        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Stage and commit
        git add build.gradle.kts versions.json CHANGELOG.md
        git commit -m "chore: Post-deployment cleanup"

        # Push to a release branch
        BRANCH="release/v${NEW_VERSION}"
        git push origin "HEAD:${BRANCH}"

        # Create PR
        gh pr create \
          --title "chore: Post-deployment cleanup" \
          --body "Auto-generated cleanup PR for version $NEW_VERSION." \
          --base main \
          --head "$BRANCH"

        echo "Created PR from branch $BRANCH"
